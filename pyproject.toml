[project]
name = "present"
version = "0.1.0"
description = "Terminal presentation tool for markdown files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.4.22",
    "pillow>=12.2.0",
    "pyfiglet>=1.0.4",
    "rich",
    "rich-pixels>=3.0.1",
]

[project.scripts]
present = "present.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]
